# MP299 Fuel Station Daily Sales (Dehradun) - project settings
data:
  train: data/raw/train.csv
  later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv
  date_col: date
  id_col: record_id
  target: litres_per_day
  group_col: zone

features:
  numeric: [highway_distance_km, nearby_pumps, price_rs, trucks_passing, temp_c, staff]
  categorical: [ownership, zone]

checks:
  sentinel_candidates: [-1, -99, -999, 99, 999, 9999, 99999]
  sentinel_min_count: 5
  unit_factors: [10, 12, 60, 100, 1000]
  unit_tolerance: 0.15        # ratio may be within 15% of the exact factor
  stuck_min_rows: 10          # a run of identical values at least this long
  typo_gap_ratio: 2.5         # jump between neighbouring sorted targets
  leak_corr: 0.98

reports:
  data_issues: reports/data_issues.json

cleaning:
  # Fixes for the problems found in Stage 1 (reports/findings.yaml)
  sentinels:
    staff: 999                # typed instead of a blank -> missing
  stuck_sensor:
    column: nearby_pumps      # same reading 2026-04-06 .. 2026-04-24 -> missing
    start_date: "2026-04-06"
    end_date: "2026-04-24"
  target_typo_threshold: 60000  # litres_per_day above this was typed 10x too big
  target_typo_factor: 10
  output: data/processed/train_clean.csv
  medians: data/processed/train_medians.json

training:
  random_state: 42
  validation_fraction: 0.20
  expected_data_sha256: 7d5e7fb87a385182fc2a2372e6cd4a5f8b48220316b37160299e895cc8e86711
  experiment_name: G119-MP299-fuel-sales
  registered_model_name: mp299-fuel-sales
  artifact_location: tracking_artifacts
  model_output: models/model.joblib
  candidates:
    - name: ridge-alpha-0.1
      model: ridge
      params: {alpha: 0.1}
    - name: ridge-alpha-1
      model: ridge
      params: {alpha: 1.0}
    - name: ridge-alpha-10
      model: ridge
      params: {alpha: 10.0}
    - name: rf-100-depth-8
      model: random_forest
      params: {n_estimators: 100, max_depth: 8, n_jobs: 1}
    - name: rf-200-depth-12
      model: random_forest
      params: {n_estimators: 200, max_depth: 12, n_jobs: 1}
    - name: gbr-100-depth-2
      model: gradient_boosting
      params: {n_estimators: 100, max_depth: 2, learning_rate: 0.1}

