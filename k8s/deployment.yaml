apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp299-api
  labels:
    app: mp299-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp299-api
  template:
    metadata:
      labels:
        app: mp299-api
    spec:
      containers:
        - name: api
          image: mp299-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
