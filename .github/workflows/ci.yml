on:
  push:
  pull_request:
  workflow_dispatch:

name: MP299 checks

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Validate MP299 Kubernetes contract
        run: python -m mp299_ops.deployment
      - name: Build MP299 API image
        run: docker build -t mp299-api:1.0 .
      - name: Start container and wait for readiness
        run: |
          docker run --detach --name mp299-api-ci --publish 127.0.0.1:8000:8000 mp299-api:1.0
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 --retry-max-time 90 http://127.0.0.1:8000/health
      - name: Compare container prediction with shipped champion
        run: python -m mp299.service_smoke --url http://127.0.0.1:8000
      - name: Show container logs and clean up
        if: always()
        run: |
          docker logs mp299-api-ci 2>&1 || true
          docker rm --force mp299-api-ci 2>/dev/null || true
